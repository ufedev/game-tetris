name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: self-hosted
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          claude_args: '--allowed-tools "Bash(git *),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh label create:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*)"'

          prompt: |
            Estás analizando el issue #${{ github.event.issue.number }} de este repositorio
            (un juego de Tetris en JavaScript vanilla, ver CLAUDE.md para contexto de arquitectura:
            `index.html` para estructura/estilos, `game.js` para toda la lógica del juego).

            Tu tarea tiene varias partes:

            1. Etiquetar el issue con labels apropiados, eligiendo SOLO entre este set fijo:
               - `bug`: algo no funciona como debería
               - `enhancement`: mejora o nueva funcionalidad
               - `question`: pregunta o duda, no describe un problema accionable
               - `documentation`: relacionado a README/CLAUDE.md/comentarios
               - `ui`: relacionado a estilos, layout, canvas, colores
               - `gameplay`: relacionado a mecánicas del juego (colisiones, rotación, velocidad, puntaje, etc.)
               - `performance`: lentitud, uso de CPU/memoria, framerate
               - `needs-triage`: si no hay suficiente información para clasificarlo con confianza

               Antes de aplicar labels, corré `gh label list` para ver cuáles ya existen en el repo.
               Si un label del set fijo que necesitás no existe todavía, creálo con `gh label create`
               usando un color y descripción razonables. Podés aplicar más de un label si corresponde.
               Aplicá los labels con `gh issue edit ${{ github.event.issue.number }} --add-label "..."`.
               No remuevas labels que ya tenga el issue y que no formen parte de este set (pueden haber
               sido puestos manualmente por una persona).

            2. Publicar un comentario de diagnóstico con `gh issue comment ${{ github.event.issue.number }}`
               que incluya:
               - Un resumen breve del problema o pedido, en tus propias palabras.
               - La causa probable o el área de código afectada (referenciando funciones/archivos
                 concretos de `game.js` o `index.html` cuando sea posible, por ejemplo `collide()`,
                 `rotatePiece()`, `resetPiece()`, `update()`, etc.).
               - El enfoque elegido para la solución.
               Si esta acción ya corrió antes sobre este mismo issue (por ejemplo, porque fue editado),
               publicá un nuevo comentario actualizado reflejando el contenido actual del issue, en vez
               de asumir que el diagnóstico anterior sigue siendo válido.

            3. Intentar implementar la solución:
               - Primero corré `gh pr list --search "issue-${{ github.event.issue.number }}- in:head"` (o
                 similar) para ver si ya existe una rama/PR abierto de una corrida anterior de este
                 workflow para este mismo issue. Si existe, hacé checkout de esa rama y agregá los
                 cambios nuevos ahí (nuevos commits), en vez de crear una rama duplicada.
               - Si no existe, creá una rama nueva a partir de main, con un nombre tipo
                 `issue-${{ github.event.issue.number }}-<slug-corto>`.
               - Hacé los cambios de código necesarios en `game.js` y/o `index.html` para resolver el
                 problema descripto en el issue, siguiendo los patrones y convenciones ya existentes en
                 el código (comentarios y texto de UI en español).
               - Comiteá y pusheá la rama.
               - Abrí (o si ya existía, dejá que se actualice solo con el push) un PR con
                 `gh pr create` que incluya `Closes #${{ github.event.issue.number }}` en la descripción
                 para que el issue se cierre automáticamente al mergear, y que explique qué se cambió y
                 por qué, en base al diagnóstico del paso 2.
               - Si el issue es una pregunta pura (`question`) o un pedido que genuinamente no requiere
                 cambios de código, usá tu criterio: no fuerces un PR vacío o irrelevante, dejá solo el
                 diagnóstico del paso 2 como respuesta.

            Todo el análisis, comentarios y descripciones de PR deben estar en español, consistente con
            el resto del repositorio.
